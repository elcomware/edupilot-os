name: Native mobile sign-in
on:
  workflow_dispatch:
  push:
    branches: [main, 'verify/mobile-login']
    paths:
      - '.github/workflows/mobile-login.yml'
      - 'clients/mobile/**'
      - 'modules/auth/**'
      - 'resources/**'
      - 'modules/core/**'
      - 'modules/tenancy/**'
      - 'packages/api-client/**'
      - 'tests/mobile/**'
      - 'package*.json'
permissions:
  contents: read

jobs:
  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: android, os: ubuntu-24.04 }
          - { platform: ios, os: macos-26 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_ORIGIN: https://localhost:4443
      EXPO_NO_TELEMETRY: '1'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
      MAESTRO_CLI_NO_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Install native UI driver
        shell: bash
        run: |
          curl -fsSL --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Generate native project from the checked-out Expo app
        working-directory: clients/mobile
        run: npx --no-install expo prebuild --platform ${{ matrix.platform }} --no-install
      - name: Build Android app with embedded release bundle
        if: matrix.platform == 'android'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y socat
          sudo chmod 666 /dev/kvm
          bash tests/mobile/prepare-tls.sh android
          cd clients/mobile/android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --max-workers=2 --console=plain
      - name: Sign in on a Pixel emulator
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          script: bash tests/mobile/fixture.sh android
      - name: Start an iPhone simulator
        if: matrix.platform == 'ios'
        run: |
          brew list socat >/dev/null 2>&1 || brew install socat
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          for runtime, models in reversed(list(devices.items())):
              phones = [d for d in models if d["name"].startswith("iPhone")]
              if phones and ".iOS-" in runtime:
                  phone = phones[0]
                  print(runtime, phone["name"], flush=True)
                  subprocess.run(["xcrun", "simctl", "boot", phone["udid"]], check=True)
                  subprocess.run(["xcrun", "simctl", "bootstatus", phone["udid"], "-b"], check=True)
                  with open(os.environ["GITHUB_ENV"], "a") as out:
                      print("IPHONE_UDID=" + phone["udid"], file=out)
                  break
          else:
              raise SystemExit("No installed iPhone simulator")
          PY
          bash tests/mobile/prepare-tls.sh ios
      - name: Build and install the iOS simulator app
        if: matrix.platform == 'ios'
        working-directory: clients/mobile/ios
        run: |
          pod install
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -type d)
          scheme=$(basename "$workspace" .xcworkspace)
          FORCE_BUNDLING=1 xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -destination "id=$IPHONE_UDID" -derivedDataPath "$RUNNER_TEMP/mobile-build" build > "$RUNNER_TEMP/xcode.log" || { tail -100 "$RUNNER_TEMP/xcode.log"; exit 1; }
          xcrun simctl install "$IPHONE_UDID" "$RUNNER_TEMP/mobile-build/Build/Products/Release-iphonesimulator/$scheme.app"
      - name: Sign in on the iPhone simulator
        if: matrix.platform == 'ios'
        run: bash tests/mobile/fixture.sh ios
      - name: Save native screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-${{ matrix.platform }}-screenshots
          path: |
            ${{ runner.temp }}/mobile-screens/${{ matrix.platform }}-signin.png
            ${{ runner.temp }}/mobile-screens/${{ matrix.platform }}-directory.png
            ${{ runner.temp }}/mobile-screens/${{ matrix.platform }}-workspace.png
          if-no-files-found: warn
          retention-days: 14
