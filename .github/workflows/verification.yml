name: Native verification

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Provision disposable native PostgreSQL
        if: matrix.database == 'postgres'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          test_password=$(openssl rand -hex 24)
          echo "::add-mask::$test_password"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE edupilot_test LOGIN PASSWORD '$test_password' CREATEDB;"
          sudo -u postgres createdb -O edupilot_test edupilot_test
          echo "EDUPILOT_TEST_POSTGRES_DSN=postgres://edupilot_test:$test_password@127.0.0.1:5432/edupilot_test?sslmode=disable" >> "$GITHUB_ENV"
          echo "EDUPILOT_TEST_POSTGRES_CREATE_DATABASES=1" >> "$GITHUB_ENV"
      - name: Unit, feature, integration and architecture tests
        run: go test -count=1 -p 4 ./...
      - name: Reachable Go vulnerability check
        if: matrix.database == 'sqlite'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Static analysis and production build
        run: |
          go vet -p 4 ./...
          go build -p 4 ./...

  clients-and-native-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/desktop/go.mod
      - name: Install client workspaces
        run: npm ci --ignore-scripts
      - name: Dependency vulnerability check
        run: npm audit --audit-level=moderate
      - name: Native launcher specifications
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Web and mobile tests and builds
        run: |
          npm run test:resources
          make test-web test-mobile
          npm run build:web
          npm run export --workspace @edupilot/mobile
      - name: Desktop gateway tests
        working-directory: clients/desktop
        run: go test -count=1 ./internal/gateway
      - name: Build and open the native Linux desktop
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev xvfb xauth xdotool dbus-x11
          node clients/desktop/scripts/build.mjs
          sudo install -D -o root -g root -m 0755 clients/desktop/bin/edupilot /opt/edupilot-ci-window/edupilot
          sudo apparmor_parser -a .github/ci/desktop-window.apparmor
          cleanup_window_fixture() {
            sudo apparmor_parser -R .github/ci/desktop-window.apparmor
            sudo rm -f /opt/edupilot-ci-window/edupilot
            sudo rmdir /opt/edupilot-ci-window
          }
          trap cleanup_window_fixture EXIT
          bash scripts/check-desktop-window.sh /opt/edupilot-ci-window/edupilot
      - name: Build the Windows desktop executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: node clients/desktop/scripts/build.mjs
      - name: Install browser runner
        working-directory: tests/e2e
        run: |
          npm ci --workspaces=false --ignore-scripts
          npm audit --workspaces=false --audit-level=moderate
          npm exec --workspaces=false -- playwright install --with-deps chromium
      - name: Exercise disposable schools on the native stack
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          EDUPILOT_E2E_MODE: native
          EDUPILOT_CAPTURE_FIXTURE_UI: "1"
        run: |
          set -euo pipefail
          python3 scripts/setup.py
          python3 scripts/dev.py > "$RUNNER_TEMP/edupilot-native.log" 2>&1 &
          native_pid=$!
          cleanup() {
            kill -TERM "$native_pid" 2>/dev/null || true
            wait "$native_pid" || true
          }
          trap cleanup EXIT
          bash scripts/ci-e2e.sh
      - name: Save disposable workspace layout evidence
        uses: actions/upload-artifact@v4
        with:
          name: workspace-layouts
          path: tests/e2e/test-results/**/qa-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Save redacted automated accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-evidence
          path: tests/e2e/test-results/**/accessibility-*.json
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          retention-days: 14
      - name: Show startup diagnostics on failure
        if: failure()
        run: tail -100 "$RUNNER_TEMP/edupilot-native.log" 2>/dev/null || true
