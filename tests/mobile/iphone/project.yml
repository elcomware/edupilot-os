name: MobileProof
options:
  deploymentTarget: { iOS: '16.4' }
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
targets:
  ProofHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.edupilot.proof.host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  DeviceTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ProofHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.edupilot.proof.tests
        TEST_TARGET_NAME: ProofHost
schemes:
  MobileProof:
    build:
      targets:
        ProofHost: all
        DeviceTests: [test]
    test:
      targets: [DeviceTests]
