appId: org.edupilot.mobile
---
- launchApp
- extendedWaitUntil:
    visible: { id: "school-id" }
    timeout: 60000
- takeScreenshot: edupilot-signin
- tapOn: { id: "school-id" }
- inputText: ${SCHOOL}
- tapOn: { id: "email" }
- inputText: registrar@example.test
- tapOn: { id: "password" }
- inputText: ${PASSWORD}
- runFlow:
    when: { platform: Android }
    commands:
      - hideKeyboard
      - tapOn: { id: "sign-in" }
- runFlow:
    when: { platform: iOS }
    commands:
      - pressKey: Enter
- assertVisible: School modules
- assertVisible: ${SCHOOL}
- extendedWaitUntil:
    visible: "Identity"
    timeout: 20000
- takeScreenshot: edupilot-directory
- scrollUntilVisible:
    element: "Students"
    direction: DOWN
- tapOn: Students
- tapOn: { id: "given-name" }
- inputText: Jamie
- tapOn: { id: "family-name" }
- inputText: Demo
- runFlow:
    when: { platform: Android }
    commands:
      - hideKeyboard
- runFlow:
    when: { platform: iOS }
    commands:
      - pressKey: Enter
- scrollUntilVisible:
    element: "Register student"
    direction: DOWN
- tapOn: Register student
- scrollUntilVisible:
    element: Active
    direction: DOWN
- assertVisible: Jamie Demo
- takeScreenshot: edupilot-students
- scrollUntilVisible:
    element: Sign out
    direction: UP
- tapOn: Sign out
- assertVisible: { id: "school-id" }
- stopApp
- launchApp
- assertVisible: { id: "school-id" }
