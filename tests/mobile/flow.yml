appId: org.edupilot.mobile
---
- launchApp
- extendedWaitUntil:
    visible: { id: "school-id" }
    timeout: 60000
- takeScreenshot: edupilot-signin
- tapOn: { id: "school-id" }
- inputText: ${SCHOOL}
- tapOn: { id: "email" }
- inputText: registrar@example.test
- tapOn: { id: "password" }
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: { id: "sign-in" }
- assertVisible: School modules
- assertVisible: ${SCHOOL}
- extendedWaitUntil:
    visible: { id: "module-tenancy" }
    timeout: 20000
- takeScreenshot: edupilot-directory
- tapOn: { id: "module-tenancy" }
- tapOn: { id: "entry-title" }
- inputText: Campus review
- hideKeyboard
- scrollUntilVisible:
    element: "Add entry"
    direction: DOWN
- tapOn: Add entry
- scrollUntilVisible:
    element: Open
    direction: DOWN
- assertVisible: Campus review
- takeScreenshot: edupilot-workspace
- scrollUntilVisible:
    element: Sign out
    direction: UP
- tapOn: Sign out
- assertVisible: { id: "school-id" }
- stopApp
- launchApp
- assertVisible: { id: "school-id" }
