name: edupilot

x-runtime-env: &runtime-env
  APP_NAME: ${APP_NAME:-EduPilot OS}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-false}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
  EDUPILOT_ENABLED_MODULES: ${EDUPILOT_ENABLED_MODULES:-}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_KEY: ${APP_KEY:?Run make setup first}
  APP_URL: ${APP_URL:-http://localhost:3000}
  APP_HOST: 0.0.0.0
  APP_PORT: "3000"
  DB_CONNECTION: sqlite
  DB_DATABASE: database/edupilot.sqlite
  EDUPILOT_DEDICATED_DATABASES: ${EDUPILOT_DEDICATED_DATABASES:-[]}
  # Redis is reserved for optional cache/queue adapters; the durable outbox uses SQL.
  REDIS_URL: redis://redis:6379/0

x-backend: &backend
  image: edupilot-backend:local
  pull_policy: never
  environment: *runtime-env
  volumes:
    - school-data:/srv/edupilot/database
    - runtime-files:/srv/edupilot/storage
  init: true

services:
  migrate:
    <<: *backend
    build:
      context: .
      target: backend
    pull_policy: build
    command: ["migrate"]
    restart: "no"
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/ready"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 10s
  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  seed-admin:
    <<: *backend
    profiles: ["tools"]
    command: ["seed-admin"]
    restart: "no"
  web:
    build:
      context: .
      target: web
    depends_on:
      api: {condition: service_healthy}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  school-data:
  runtime-files:
