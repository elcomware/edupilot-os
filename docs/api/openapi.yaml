openapi: 3.1.0
info:
  title: EduPilot OS API
  version: 1.0.0
  description: This API serves the school identified by the authenticated session. Protected requests
    use exactly one Authorization header containing Bearer followed by the opaque session token. X-School-ID
    is optional and must match the authenticated school. All listed permission names on an operation are
    required. Role or membership changes are reflected on later requests. The deployed module catalog
    determines which specialized routes are available.
servers:
- url: /api/v1
  description: Same-origin API
tags:
- name: Deployment
- name: Sessions
- name: Modules
- name: Workspaces
- name: Students
- name: Enrollment
- name: Documents
security:
- bearerSession: []
paths:
  /health:
    get:
      tags:
      - Deployment
      operationId: getHealth
      summary: Check process liveness
      security: []
      responses:
        '200':
          description: The API listener is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Live'
  /ready:
    get:
      tags:
      - Deployment
      operationId: getReadiness
      summary: Check database readiness
      security: []
      responses:
        '200':
          description: Configured pools, placement markers, expected history and local receipts are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          $ref: '#/components/responses/Unavailable'
  /session:
    post:
      tags:
      - Sessions
      operationId: createSession
      summary: Sign in to a school
      security: []
      requestBody:
        required: true
        description: One JSON object, up to 8 KiB. Unknown properties are rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Bearer token and school principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags:
      - Sessions
      operationId: getSession
      summary: Read current school and permissions
      parameters:
      - $ref: '#/components/parameters/Scope'
      responses:
        '200':
          description: Current principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags:
      - Sessions
      operationId: endSession
      summary: Revoke the current bearer token
      parameters:
      - $ref: '#/components/parameters/Scope'
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /modules:
    get:
      tags:
      - Modules
      operationId: listModules
      summary: List available modules
      x-required-permissions:
      - modules.read
      parameters:
      - $ref: '#/components/parameters/Scope'
      responses:
        '200':
          description: Enabled modules for which this principal has at least one capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /modules/{key}:
    get:
      tags:
      - Modules
      operationId: getModule
      summary: Read module capabilities
      x-required-permissions:
      - modules.read
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/ModuleKey'
      responses:
        '200':
          description: Localized descriptor with capabilities filtered for the principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /modules/{key}/workspace:
    get:
      tags:
      - Workspaces
      operationId: listEntries
      summary: List a module’s workspace entries
      description: Available for enabled modules with a generic work list. Students uses its dedicated
        roster.
      x-required-permissions:
      - workspace.read
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/ModuleKey'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: School-scoped records ordered by ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '422':
          $ref: '#/components/responses/InvalidFields'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags:
      - Workspaces
      operationId: createEntry
      summary: Create a workspace entry
      x-required-permissions:
      - workspace.write
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/ModuleKey'
      requestBody:
        required: true
        description: One JSON object, up to 16 KiB. Unknown properties are rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntry'
      responses:
        '201':
          description: New open entry at version 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntry'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '422':
          $ref: '#/components/responses/InvalidFields'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /modules/{key}/workspace/{id}:
    get:
      tags:
      - Workspaces
      operationId: getEntry
      summary: Read a workspace entry
      x-required-permissions:
      - workspace.read
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/ModuleKey'
      - $ref: '#/components/parameters/EntryID'
      responses:
        '200':
          description: The current entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags:
      - Workspaces
      operationId: updateEntry
      summary: Update a workspace entry
      x-required-permissions:
      - workspace.write
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/ModuleKey'
      - $ref: '#/components/parameters/EntryID'
      requestBody:
        required: true
        description: One JSON object, up to 16 KiB. Unknown properties are rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEntry'
      responses:
        '200':
          description: Updated entry with its incremented version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntry'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidFields'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /students:
    get:
      tags:
      - Students
      operationId: listStudents
      summary: List active students
      x-required-permissions:
      - students.read
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Active records ordered by family name, given name, and ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPage'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MissingModuleRoute'
        '422':
          $ref: '#/components/responses/InvalidFields'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags:
      - Students
      operationId: createStudent
      summary: Register a student
      x-required-permissions:
      - students.write
      parameters:
      - $ref: '#/components/parameters/Scope'
      requestBody:
        required: true
        description: One JSON object, up to 16 KiB. Unknown properties are rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudent'
      responses:
        '201':
          description: Active student at version 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
          headers:
            Location:
              description: Path to the student.
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MissingModuleRoute'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidFields'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /students/{id}:
    get:
      tags:
      - Students
      operationId: getStudent
      summary: Read an active or archived student
      x-required-permissions:
      - students.read
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/StudentID'
      responses:
        '200':
          description: Current student.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MissingModuleRoute'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags:
      - Students
      operationId: updateStudent
      summary: Rename an active student
      x-required-permissions:
      - students.write
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/StudentID'
      requestBody:
        required: true
        description: One JSON object, up to 16 KiB. Unknown properties are rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudent'
      responses:
        '200':
          description: Updated student with incremented version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MissingModuleRoute'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidFields'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags:
      - Students
      operationId: archiveStudent
      summary: Archive an active student
      description: The record leaves the active list and remains readable by ID.
      x-required-permissions:
      - students.write
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/StudentID'
      - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204':
          description: Student archived and version incremented.
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MissingModuleRoute'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidFields'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /enrollment/placements:
    get:
      tags:
      - Enrollment
      operationId: listPlacements
      summary: List school placements
      x-required-permissions:
      - students.read
      - workspace.read
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/StudentFilter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Active and withdrawn placements ordered by academic year descending then ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementPage'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MissingModuleRoute'
        '422':
          $ref: '#/components/responses/InvalidFields'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags:
      - Enrollment
      operationId: recordPlacement
      summary: Record a placement for an active student
      description: One placement per school, student and academic year. An identical retry of an existing
        active placement returns the original record. A conflicting grade or course, an archived student
        on first registration, or an already withdrawn placement returns 409.
      x-required-permissions:
      - students.write
      - workspace.write
      parameters:
      - $ref: '#/components/parameters/Scope'
      requestBody:
        required: true
        description: One JSON object, up to 16 KiB. Unknown properties are rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlacement'
      responses:
        '201':
          description: New active placement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Placement'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MissingModuleRoute'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidFields'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: Identical existing active placement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Placement'
  /enrollment/placements/{id}:
    patch:
      tags:
      - Enrollment
      operationId: withdrawPlacement
      summary: Withdraw an active placement
      x-required-permissions:
      - students.write
      - workspace.write
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/PlacementID'
      requestBody:
        required: true
        description: One JSON object, up to 16 KiB. Unknown properties are rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawPlacement'
      responses:
        '200':
          description: Withdrawn placement with incremented version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Placement'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MissingModuleRoute'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidFields'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /documents/files:
    post:
      tags:
      - Documents
      operationId: uploadDocument
      summary: Upload a private document
      x-required-permissions:
      - documents.write
      parameters:
      - $ref: '#/components/parameters/Scope'
      requestBody:
        required: true
        description: Send 1 to 8,388,608 raw bytes. Content-Type must match the detected contents. UTF-8
          text may specify charset=utf-8. Multipart and JSON wrappers are unsupported.
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          text/plain:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: New file ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCreated'
          headers:
            Location:
              description: Path to download this file.
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MissingModuleRoute'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Storage'
  /documents/files/{id}:
    get:
      tags:
      - Documents
      operationId: downloadDocument
      summary: Download a private document
      x-required-permissions:
      - documents.read
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/DocumentID'
      responses:
        '200':
          description: Raw file bytes with the detected media type.
          headers:
            Content-Disposition:
              description: Attachment filename uses the server-issued ID and validated extension.
              schema:
                type: string
            Content-Length:
              description: File size in bytes.
              schema:
                type: integer
                minimum: 1
                maximum: 8388608
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MissingModuleRoute'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Storage'
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: Opaque session token
  parameters:
    Scope:
      name: X-School-ID
      in: header
      required: false
      description: Optional assertion of the session school. Repeated or mismatched headers are rejected
        with 403.
      schema:
        $ref: '#/components/schemas/SchoolID'
    ModuleKey:
      name: key
      in: path
      required: true
      description: Enabled module key returned by the catalog.
      schema:
        type: string
    EntryID:
      name: id
      in: path
      required: true
      description: Workspace entry ID.
      schema:
        type: string
    StudentID:
      name: id
      in: path
      required: true
      description: Student ID.
      schema:
        $ref: '#/components/schemas/StudentID'
    PlacementID:
      name: id
      in: path
      required: true
      description: Placement ID returned by the collection.
      schema:
        type: string
    DocumentID:
      name: id
      in: path
      required: true
      description: Canonical lowercase UUIDv4 returned by upload.
      schema:
        $ref: '#/components/schemas/DocumentID'
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum page size. Supply at most one value.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      required: false
      description: Number of records to skip. Supply at most one value.
      schema:
        type: integer
        minimum: 0
        default: 0
    StudentFilter:
      name: studentId
      in: query
      required: false
      description: Optional student ID for narrowing a placement list.
      schema:
        type: string
        maxLength: 64
    ExpectedVersion:
      name: version
      in: query
      required: true
      description: Current version of the student to archive. Supply exactly one value.
      schema:
        $ref: '#/components/schemas/Version'
  responses:
    Unauthorized:
      description: Invalid credentials, or missing, expired or revoked bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
    Forbidden:
      description: Required permissions are missing, or the asserted school differs from the session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidJSON:
      description: Malformed input, unknown JSON fields or invalid query syntax.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidFields:
      description: One or more fields or pagination bounds failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Stale version or a requested transition conflicts with current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Missing:
      description: No matching resource is visible in the authenticated school.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: Request exceeds the endpoint size limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Application configuration or storage is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: Unable to complete this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Throttled:
      description: Login attempt or concurrency limit reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Seconds before retry.
          schema:
            type: integer
            const: 60
    Storage:
      description: Document store unavailable, integrity check failed, or transfer capacity is exhausted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Present when transfer capacity is exhausted.
          schema:
            type: integer
            const: 1
    Unsupported:
      description: Missing, unsupported, or mismatched Content-Type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MissingModuleRoute:
      description: Module is disabled, or the requested record is absent or belongs to another school.
        A disabled route returns the router’s plain-text 404.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
        text/plain:
          schema:
            type: string
  schemas:
    SchoolID:
      type: string
      pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
      description: School slug selected during authentication.
    Version:
      type: integer
      format: int64
      minimum: 1
      description: Pass the most recently read version when updating or archiving. A successful change
        increments it.
    StudentID:
      type: string
      pattern: ^[a-f0-9]{32}$
    Permission:
      type: string
      enum:
      - modules.read
      - workspace.read
      - workspace.write
      - students.read
      - students.write
      - documents.read
      - documents.write
      - identity.members.manage
    Principal:
      type: object
      required:
      - id
      - school
      - permissions
      properties:
        id:
          type: string
        school:
          $ref: '#/components/schemas/SchoolID'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
      additionalProperties: false
    Credentials:
      type: object
      required:
      - school
      - email
      - password
      properties:
        school:
          $ref: '#/components/schemas/SchoolID'
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          description: Login accepts up to 72 UTF-8 bytes.
      additionalProperties: false
    Session:
      type: object
      required:
      - token
      - principal
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]+$
          description: Opaque bearer token with a 12-hour expiry.
        principal:
          $ref: '#/components/schemas/Principal'
      additionalProperties: false
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
          additionalProperties: false
      additionalProperties: false
    LocalizedTitle:
      type: object
      required:
      - en
      - fr
      properties:
        en:
          type: string
        fr:
          type: string
      additionalProperties: false
    Module:
      type: object
      required:
      - key
      - group
      - title
      - capabilities
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,39}$
        group:
          type: string
        title:
          $ref: '#/components/schemas/LocalizedTitle'
        capabilities:
          type: array
          items:
            type: string
            description: Capabilities visible to this principal, including specialized actions when enabled.
      additionalProperties: false
    ModuleList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Module'
      additionalProperties: false
    WorkspaceTitle:
      type: string
      minLength: 1
      maxLength: 160
      description: Counted after trimming surrounding space.
    EntryStatus:
      type: string
      enum:
      - open
      - closed
    WorkspaceEntry:
      type: object
      required:
      - id
      - title
      - status
      - version
      properties:
        id:
          type: string
        title:
          $ref: '#/components/schemas/WorkspaceTitle'
        status:
          $ref: '#/components/schemas/EntryStatus'
        version:
          $ref: '#/components/schemas/Version'
      additionalProperties: false
    WorkspacePage:
      type: object
      required:
      - module
      - items
      - total
      properties:
        module:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceEntry'
        total:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
    CreateEntry:
      type: object
      required:
      - title
      properties:
        title:
          $ref: '#/components/schemas/WorkspaceTitle'
      additionalProperties: false
    UpdateEntry:
      type: object
      required:
      - title
      - status
      - version
      properties:
        title:
          $ref: '#/components/schemas/WorkspaceTitle'
        status:
          $ref: '#/components/schemas/EntryStatus'
        version:
          $ref: '#/components/schemas/Version'
      additionalProperties: false
    StudentName:
      type: string
      minLength: 1
      maxLength: 100
      description: One to 100 Unicode characters after trimming. Control characters are rejected.
    CreateStudent:
      type: object
      required:
      - givenName
      - familyName
      properties:
        givenName:
          $ref: '#/components/schemas/StudentName'
        familyName:
          $ref: '#/components/schemas/StudentName'
      additionalProperties: false
    UpdateStudent:
      type: object
      required:
      - givenName
      - familyName
      - version
      properties:
        givenName:
          $ref: '#/components/schemas/StudentName'
        familyName:
          $ref: '#/components/schemas/StudentName'
        version:
          $ref: '#/components/schemas/Version'
      additionalProperties: false
    Student:
      type: object
      required:
      - id
      - givenName
      - familyName
      - version
      - status
      properties:
        id:
          $ref: '#/components/schemas/StudentID'
        givenName:
          $ref: '#/components/schemas/StudentName'
        familyName:
          $ref: '#/components/schemas/StudentName'
        version:
          $ref: '#/components/schemas/Version'
        status:
          type: string
          enum:
          - active
          - archived
      additionalProperties: false
    StudentPage:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Student'
        total:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
    CreatePlacement:
      type: object
      required:
      - studentId
      - academicYear
      - grade
      properties:
        studentId:
          $ref: '#/components/schemas/StudentID'
        academicYear:
          type: string
          pattern: ^[1-9][0-9]{3}-[1-9][0-9]{3}$
          description: Two consecutive years, for example 2026-2027.
        grade:
          type: string
          minLength: 1
          maxLength: 48
        course:
          type: string
          maxLength: 120
          description: Optional course label. Omitted from responses when empty.
      additionalProperties: false
    Placement:
      type: object
      required:
      - id
      - studentId
      - academicYear
      - grade
      - status
      - version
      properties:
        id:
          type: string
        studentId:
          $ref: '#/components/schemas/StudentID'
        academicYear:
          type: string
          pattern: ^[1-9][0-9]{3}-[1-9][0-9]{3}$
          description: Two consecutive years, for example 2026-2027.
        grade:
          type: string
          minLength: 1
          maxLength: 48
        course:
          type: string
          maxLength: 120
          description: Optional course label. Omitted from responses when empty.
        status:
          type: string
          enum:
          - active
          - withdrawn
        version:
          $ref: '#/components/schemas/Version'
      additionalProperties: false
    WithdrawPlacement:
      type: object
      required:
      - status
      - version
      properties:
        status:
          type: string
          const: withdrawn
        version:
          $ref: '#/components/schemas/Version'
      additionalProperties: false
    PlacementPage:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Placement'
        total:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
    DocumentID:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    DocumentCreated:
      type: object
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/DocumentID'
      additionalProperties: false
    Live:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: ok
      additionalProperties: false
    Ready:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: ready
      additionalProperties: false
