openapi: 3.1.0
info:
  title: EduPilot OS API
  version: 1.0.0
  description: This API serves the school identified by the authenticated session. Protected requests
    use exactly one Authorization header containing Bearer followed by the opaque session token. X-School-ID
    is optional and must match the authenticated school. All listed permission names on an operation are
    required. Role or membership changes are reflected on later requests. The deployed module catalog
    determines which specialized routes are available. Explicit tenant hierarchy grants authorize the
    contexts and hierarchy endpoints independently of school role permissions. The tenant query selects
    the hierarchy target while X-School-ID continues to identify the credential realm.
servers:
- url: /api/v1
  description: Same-origin API
tags:
- name: Deployment
- name: Sessions
- name: Modules
- name: Workspaces
security:
- bearerSession: []
paths:
  /health:
    get:
      tags:
      - Deployment
      operationId: getHealth
      summary: Check process liveness
      security: []
      responses:
        '200':
          description: The API listener is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Live'
  /ready:
    get:
      tags:
      - Deployment
      operationId: getReadiness
      summary: Check database readiness
      security: []
      responses:
        '200':
          description: Configured pools, placement markers, expected history and local receipts are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/contexts:
    get:
      tags: [Sessions]
      operationId: listTenantContexts
      summary: List explicit active tenant hierarchy-read grants for the signed-in subject
      description: Live keyset pages ordered by tenant UUID. Each page revalidates the session, membership and grants. An unavailable or closed returned choice fails the entire page. Responses use Cache-Control no-store.
      parameters:
      - $ref: '#/components/parameters/Scope'
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      - name: cursor
        in: query
        schema: {type: string, maxLength: 1024}
      responses:
        '200':
          description: Current explicit choices, with tenant, subject, permission, grantId, grantVersion, expiresAt and optional nextCursor.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: {$ref: '#/components/schemas/TenantAuthorization'}
                  nextCursor: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Invalid, duplicate, unknown or ambiguous query/header input.
        '503':
          $ref: '#/components/responses/Unavailable'
  /tenancy/hierarchy:
    get:
      tags: [Modules]
      operationId: listTenantHierarchy
      summary: Read a tenant hierarchy using an explicit tenant-wide hierarchy-read grant
      description: Reauthorizes every request and continuation. Tenant selection is request-local. Existing X-School-ID denotes the credential realm. An authorized in-flight read may finish within the ten-second request deadline after revocation. Responses use Cache-Control no-store.
      x-permissions: [tenancy.hierarchy.read]
      parameters:
      - $ref: '#/components/parameters/Scope'
      - name: tenant
        in: query
        required: true
        schema: {type: string, format: uuid}
      - name: kind
        in: query
        required: true
        schema: {type: string, enum: [organizations, schools, campuses]}
      - name: organization
        in: query
        description: Immediate parent for organizations or owning organization for schools.
        schema: {type: string, format: uuid}
      - name: school
        in: query
        description: Immediate owning school for campuses.
        schema: {type: string, format: uuid}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 25}
      - name: cursor
        in: query
        schema: {type: string, maxLength: 2048}
      responses:
        '200':
          description: Directory entries with verified ancestry, hierarchyVersion, placementEpoch and optional nextCursor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HierarchyPage'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Authorized target has no matching hierarchy owner.
        '409':
          description: Directory continuation is stale. Start a fresh listing.
        '422':
          description: Invalid, duplicate, unknown or ambiguous query/header input or cursor.
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/me:
    get:
      tags:
      - Sessions
      operationId: getCurrentUser
      summary: Read the signed-in user's account, school membership, role and effective permissions
      parameters:
      - $ref: '#/components/parameters/Scope'
      responses:
        '200':
          description: Current account in the authenticated school.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /session:
    post:
      tags:
      - Sessions
      operationId: createSession
      summary: Sign in to a school
      security: []
      requestBody:
        required: true
        description: One JSON object, up to 8 KiB. Unknown properties are rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Bearer token and school principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/Throttled'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags:
      - Sessions
      operationId: getSession
      summary: Read current school and permissions
      parameters:
      - $ref: '#/components/parameters/Scope'
      responses:
        '200':
          description: Current principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags:
      - Sessions
      operationId: endSession
      summary: Revoke the current bearer token
      parameters:
      - $ref: '#/components/parameters/Scope'
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /modules:
    get:
      tags:
      - Modules
      operationId: listModules
      summary: List available modules
      x-required-permissions:
      - modules.read
      parameters:
      - $ref: '#/components/parameters/Scope'
      responses:
        '200':
          description: Enabled modules for which this principal has at least one capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /modules/{key}:
    get:
      tags:
      - Modules
      operationId: getModule
      summary: Read module capabilities
      x-required-permissions:
      - modules.read
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/ModuleKey'
      responses:
        '200':
          description: Localized descriptor with capabilities filtered for the principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /modules/{key}/workspace:
    get:
      tags:
      - Workspaces
      operationId: listEntries
      summary: List a module’s workspace entries
      description: The Schools module exposes a tenant-scoped work list.
      x-required-permissions:
      - workspace.read
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/ModuleKey'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: School-scoped records ordered by ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '422':
          $ref: '#/components/responses/InvalidFields'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags:
      - Workspaces
      operationId: createEntry
      summary: Create a workspace entry
      x-required-permissions:
      - workspace.write
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/ModuleKey'
      requestBody:
        required: true
        description: One JSON object, up to 16 KiB. Unknown properties are rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntry'
      responses:
        '201':
          description: New open entry at version 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntry'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '422':
          $ref: '#/components/responses/InvalidFields'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /modules/{key}/workspace/{id}:
    get:
      tags:
      - Workspaces
      operationId: getEntry
      summary: Read a workspace entry
      x-required-permissions:
      - workspace.read
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/ModuleKey'
      - $ref: '#/components/parameters/EntryID'
      responses:
        '200':
          description: The current entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      tags:
      - Workspaces
      operationId: updateEntry
      summary: Update a workspace entry
      x-required-permissions:
      - workspace.write
      parameters:
      - $ref: '#/components/parameters/Scope'
      - $ref: '#/components/parameters/ModuleKey'
      - $ref: '#/components/parameters/EntryID'
      requestBody:
        required: true
        description: One JSON object, up to 16 KiB. Unknown properties are rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEntry'
      responses:
        '200':
          description: Updated entry with its incremented version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEntry'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Missing'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidFields'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      bearerFormat: Opaque session token
  parameters:
    Scope:
      name: X-School-ID
      in: header
      required: false
      description: Optional assertion of the session school. Repeated or mismatched headers are rejected
        with 403.
      schema:
        $ref: '#/components/schemas/SchoolID'
    ModuleKey:
      name: key
      in: path
      required: true
      description: Enabled module key returned by the catalog.
      schema:
        type: string
    EntryID:
      name: id
      in: path
      required: true
      description: Workspace entry ID.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum page size. Supply at most one value.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      required: false
      description: Number of records to skip. Supply at most one value.
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    Unauthorized:
      description: Invalid credentials, or missing, expired or revoked bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
    Forbidden:
      description: Required permissions are missing, or the asserted school differs from the session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidJSON:
      description: Malformed input, unknown JSON fields or invalid query syntax.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidFields:
      description: One or more fields or pagination bounds failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Stale version or a requested transition conflicts with current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Missing:
      description: No matching resource is visible in the authenticated school.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Application configuration or storage is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Internal:
      description: Unable to complete this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Throttled:
      description: Login attempt or concurrency limit reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Seconds before retry.
          schema:
            type: integer
            const: 60
  schemas:
    TenantAuthorization:
      type: object
      required: [subject, tenant, permission, grantId, grantVersion, expiresAt]
      properties:
        subject:
          type: object
          required: [realm, id]
          properties:
            realm: {type: string}
            id: {type: string}
        tenant: {type: string, format: uuid}
        permission: {type: string, const: tenancy.hierarchy.read}
        grantId: {type: string, format: uuid}
        grantVersion: {type: integer, minimum: 1}
        expiresAt: {type: integer, description: UTC epoch seconds}
    HierarchyPage:
      type: object
      required: [entries, hierarchyVersion, placementEpoch]
      properties:
        hierarchyVersion: {type: integer, minimum: 1}
        placementEpoch: {type: integer, minimum: 1}
        nextCursor: {type: string}
        entries:
          type: array
          items:
            type: object
            required: [id, name, active, path]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              code: {type: string}
              timezone: {type: string}
              active: {type: boolean}
              path:
                type: object
                description: Tenant UUID, selected organization/school/campus UUIDs, root-first ancestors, hierarchyVersion and effective active state.

    SchoolID:
      type: string
      pattern: ^[a-z0-9][a-z0-9_-]{0,62}$
      description: School slug selected during authentication.
    Version:
      type: integer
      format: int64
      minimum: 1
      description: Pass the most recently read version when updating or archiving. A successful change
        increments it.
    Permission:
      type: string
      enum:
      - auth.members.manage
      - workspace.read
      - workspace.write
      - modules.read
    Principal:
      type: object
      required:
      - id
      - school
      - permissions
      properties:
        id:
          type: string
        school:
          $ref: '#/components/schemas/SchoolID'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
      additionalProperties: false
    CurrentUser:
      type: object
      required:
      - id
      - email
      - membership
      - permissions
      additionalProperties: false
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        membership:
          type: object
          required:
          - userId
          - school
          - role
          additionalProperties: false
          properties:
            userId:
              type: string
            school:
              $ref: '#/components/schemas/SchoolID'
            role:
              type: string
              enum:
              - admin
              - registrar
              - viewer
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    Credentials:
      type: object
      required:
      - school
      - email
      - password
      properties:
        school:
          $ref: '#/components/schemas/SchoolID'
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          description: Login accepts up to 72 UTF-8 bytes.
      additionalProperties: false
    Session:
      type: object
      required:
      - token
      - principal
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]+$
          description: Opaque bearer token with a 12-hour expiry.
        principal:
          $ref: '#/components/schemas/Principal'
      additionalProperties: false
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
          additionalProperties: false
      additionalProperties: false
    LocalizedTitle:
      type: object
      required:
      - en
      - fr
      properties:
        en:
          type: string
        fr:
          type: string
      additionalProperties: false
    Module:
      type: object
      required:
      - key
      - group
      - title
      - capabilities
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,39}$
        group:
          type: string
        title:
          $ref: '#/components/schemas/LocalizedTitle'
        capabilities:
          type: array
          items:
            type: string
            description: Capabilities visible to this principal, including specialized actions when enabled.
      additionalProperties: false
    ModuleList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Module'
      additionalProperties: false
    WorkspaceTitle:
      type: string
      minLength: 1
      maxLength: 160
      description: Counted after trimming surrounding space.
    EntryStatus:
      type: string
      enum:
      - open
      - closed
    WorkspaceEntry:
      type: object
      required:
      - id
      - title
      - status
      - version
      properties:
        id:
          type: string
        title:
          $ref: '#/components/schemas/WorkspaceTitle'
        status:
          $ref: '#/components/schemas/EntryStatus'
        version:
          $ref: '#/components/schemas/Version'
      additionalProperties: false
    WorkspacePage:
      type: object
      required:
      - module
      - items
      - total
      properties:
        module:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceEntry'
        total:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
    CreateEntry:
      type: object
      required:
      - title
      properties:
        title:
          $ref: '#/components/schemas/WorkspaceTitle'
      additionalProperties: false
    UpdateEntry:
      type: object
      required:
      - title
      - status
      - version
      properties:
        title:
          $ref: '#/components/schemas/WorkspaceTitle'
        status:
          $ref: '#/components/schemas/EntryStatus'
        version:
          $ref: '#/components/schemas/Version'
      additionalProperties: false
    Live:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: ok
      additionalProperties: false
    Ready:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: ready
      additionalProperties: false
